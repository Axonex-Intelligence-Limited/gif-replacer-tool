[package]
name = "gif-replacer-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = [ "dialog-message", "shell-open", "dialog-open", "dialog-ask", "fs-read-file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
dirs = "5.0"
serialport = "4.2"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
