name: Build Windows

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# softprops/action-gh-release needs this. The default GITHUB_TOKEN is
# read-only, and the release step would 403 without it.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A cold Tauri release build is ~20 minutes of Windows runner time
      # (billed at 2x on a private repo). The cache is what makes a
      # every-push trigger affordable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # setup-windows.ps1 is a separate deliverable from the .exe (it ships as
      # its own release asset), and cargo test does not touch it. Until this
      # step existed, its 39 tests ran only on a developer's machine.
      #
      # Running them here also executes them against real Windows path
      # semantics for the first time. Locally they run on macOS, where
      # Test-Path and Join-Path handle the C:\-prefixed fixtures differently -
      # which is what caught the DriveNotFoundException and host-separator bugs
      # during development, and means the suite has never been proven on the
      # platform it targets.
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester tests (Windows setup script)
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./scripts/tests -PassThru
          if ($r.Result -ne 'Passed') {
            Write-Error "$($r.FailedCount) of $($r.TotalCount) Pester tests failed."
            exit 1
          }

      - run: npm ci

      - name: Build
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gif-replacer-tool-windows
          # error, not the default warn: the productName-derived binary name is
          # an assumption, and a rename mismatch would otherwise upload nothing
          # and leave the run green — the worst outcome for this spec's purpose.
          if-no-files-found: error
          path: |
            src-tauri/target/release/GIF Replacer Tool.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/GIF Replacer Tool.exe
            src-tauri/target/release/bundle/nsis/*.exe
